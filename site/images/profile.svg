<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- Placeholder artwork until a real photo is added: the DD logo as a hex nut on a technical-drawing grid. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#1e4f7a"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0v20" fill="none" stroke="#fff" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="320" height="320" fill="url(#bg)"/>
  <rect width="320" height="320" fill="url(#grid)"/>

  <!-- Hex nut with the monogram -->
  <path d="M160 58 248 109v102l-88 51-88-51V109z" fill="#fff" fill-opacity="0.1" stroke="#fff" stroke-width="3"/>
  <circle cx="160" cy="160" r="66" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="160" y="184" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#fff">DD</text>

  <!-- Work-zero crosshair, top right -->
  <g stroke="#fff" stroke-opacity="0.7" stroke-width="2" fill="none">
    <circle cx="276" cy="44" r="12"/>
    <path d="M276 24v40M256 44h40"/>
  </g>

  <!-- Dimension line, bottom -->
  <g stroke="#fff" stroke-opacity="0.7" stroke-width="1.5">
    <path d="M72 290h176M72 282v16M248 282v16"/>
    <path d="M72 290l8-4v8zM248 290l-8-4v8z" fill="#fff" fill-opacity="0.7"/>
  </g>
  <text x="160" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#fff" fill-opacity="0.85">± 0.01 mm</text>
</svg>
