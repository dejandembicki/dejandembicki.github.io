<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Dejan Dembicki</title>
  <meta name="robots" content="noindex">
  <!-- GitHub Pages serves this file for any unknown URL, from any folder depth, so links are absolute. -->
  <link rel="icon" href="/licni-sajt/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/licni-sajt/css/tokens.css">
  <link rel="stylesheet" href="/licni-sajt/css/base.css">
  <link rel="stylesheet" href="/licni-sajt/css/components.css">
  <style>
    .not-found {
      display: grid;
      place-content: center;
      min-height: 100vh;
      gap: 12px;
      padding: 24px;
      text-align: center;
    }

    .not-found strong {
      font-family: var(--font-display);
      font-size: 5rem;
      line-height: 1;
      color: var(--color-accent);
    }
  </style>
</head>
<body>
  <main class="not-found">
    <strong>404</strong>
    <h1>Page not found</h1>
    <p>Stranica nije pronađena · Seite nicht gefunden</p>
    <p><a class="btn btn--primary" href="/licni-sajt/">Back to the home page</a></p>
  </main>
</body>
</html>
